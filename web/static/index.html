<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>dagsflow</title>
<style>
:root{
  --canvas:#FFFFFF; --surface:#FFFFFF; --head:#F7F8F9; --line:#E4E7EB; --pill:#0F6FDE; --ink:#16202A; --muted:#5E6B78; --rule:#D3D9DF; --action:#1F5FD1;
  --s-success:#2E9B57; --s-failed:#D23B3B; --s-running:#1FA7D6; --s-queued:#9AA5B1; --s-up_for_retry:#E0A21B;
  --s-skipped:#E57FB8; --s-up_for_reschedule:#6FD3C8; --s-upstream_failed:#F08A2C; --s-none:#FFFFFF;
  --sans: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --code: ui-monospace, "SF Mono", "Cascadia Code", Menlo, Consolas, monospace;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0}
body{background:var(--canvas);color:var(--ink);font:14px/1.45 var(--sans);font-variant-numeric:tabular-nums}
a{color:var(--action);text-decoration:none}
a:hover{text-decoration:underline}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--action);outline-offset:2px}
code,.id{font-family:var(--code);font-size:13px}

header.top{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:8px;padding:0 20px;height:58px;background:#fff;color:var(--ink);box-shadow:0 2px 6px rgba(22,32,42,.12)}
header.top .brand{display:flex;align-items:center;gap:8px;font-weight:700;font-size:18px;color:var(--ink);margin-right:18px;letter-spacing:-.01em}
header.top .brand:hover{text-decoration:none}
.menu{display:flex;align-items:center;gap:2px;height:100%}
.menu>a,.menu .dd>button{display:flex;align-items:center;height:100%;padding:0 12px;color:var(--ink);font-weight:600;font-size:14px;border:0;background:none;border-bottom:3px solid transparent}
.menu>a:hover,.menu .dd>button:hover{text-decoration:none;background:#F3F5F7}
.menu>a.on,.menu .dd.on>button{border-bottom-color:var(--pill)}
.dd{position:relative;height:100%}
.menu .dd>button::after,.userBtn::after{content:"";margin-left:6px;border:4px solid transparent;border-top-color:#8A96A3;margin-top:4px}
.ddm{display:none;position:absolute;top:100%;left:0;min-width:180px;background:#fff;border:1px solid var(--line);border-radius:4px;box-shadow:0 6px 18px rgba(22,32,42,.14);padding:4px 0;z-index:30}
.dd.open .ddm{display:block}
.ddm a,.ddm button,.ddm .info{display:block;width:100%;text-align:left;padding:8px 16px;color:var(--ink);font-weight:400;border:0;background:none;font-size:14px}
.ddm a:hover,.ddm button:hover{background:#F0F4FA;text-decoration:none}
.ddm .info{color:var(--muted);font-size:12px;border-bottom:1px solid var(--line);margin-bottom:4px}
.ddm.right{left:auto;right:0}
.clock{font-size:14px;font-weight:600;color:var(--ink);white-space:nowrap}
.avatar{width:32px;height:32px;border-radius:50%;background:#DCE8FB;color:#1F4E9C;font-weight:700;display:flex;align-items:center;justify-content:center;font-size:13px}
.userBtn{display:flex;align-items:center;gap:6px;border:0;background:none;padding:0 4px;height:100%}
.sched{margin-left:auto;margin-right:12px;display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted)}
.sched i{width:8px;height:8px;border-radius:50%;background:var(--s-queued)}
.sched.alive i{background:#2E9B57}
.sched.dead{color:var(--s-failed)}
.sched.dead i{background:var(--s-failed)}

main{padding:20px 12px 40px;max-width:1920px;margin:0 auto}
h1{font-size:22px;margin:0;letter-spacing:-.01em}
.sub{color:var(--muted);font-size:13px}
.panel{background:var(--surface);border:1px solid var(--rule);border-radius:6px;overflow-x:auto}
.banner{padding:10px 14px;border-radius:6px;margin-bottom:16px;font-size:13px}
.banner.warn{background:#FFF4E0;border:1px solid #F3D3A0}
.banner.err{background:#FDECEC;border:1px solid #F1B8B8}
.banner pre{margin:6px 0 0;white-space:pre-wrap;font:12px var(--code)}

/* buttons */
.btn{border:1px solid var(--rule);background:var(--surface);border-radius:5px;padding:6px 12px;font-weight:500}
.btn:hover{border-color:#9FAAB5}
.btn.primary{background:var(--action);border-color:var(--action);color:#fff}
.btn.danger{color:var(--s-failed)}
.btn:disabled{opacity:.5;cursor:default}
.iconbtn{border:0;background:none;padding:4px 8px;border-radius:4px;color:var(--action);font-weight:600}
.iconbtn:hover{background:#E6EDFA}

/* toggle */
.toggle{position:relative;width:36px;height:20px;border-radius:10px;border:0;background:#C9CFD6;padding:0;flex:none}
.toggle::after{content:"";position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:#fff;transition:left .15s;box-shadow:0 1px 2px rgba(0,0,0,.25)}
.toggle[aria-checked="true"]{background:var(--pill)}
.toggle[aria-checked="true"]::after{left:18px}

/* dag list */
table.list{width:100%;border-collapse:collapse}
table.list th{text-align:left;font-weight:600;font-size:12px;color:var(--muted);padding:10px 14px;border-bottom:1px solid var(--rule)}
table.list td{padding:12px 14px;border-bottom:1px solid #E7EBEF;vertical-align:middle}
table.list tr:last-child td{border-bottom:0}
table.list tr.paused .dagname{color:var(--muted)}
.dagname{font-weight:600;font-family:var(--code);font-size:14px}
.tag{display:inline-block;font-size:11px;padding:1px 7px;border-radius:9px;background:#E6EBF0;color:var(--muted);margin-right:4px}
.dots{display:flex;gap:3px;align-items:center}
.dot{width:12px;height:12px;border-radius:2px;border:1px solid rgba(0,0,0,.18);flex:none}
.muted{color:var(--muted)}

/* ---- task instance details (Airflow-style) ---- */
.dagTitle a{color:inherit}
.tiLinks{display:flex;gap:28px;padding:6px 0 12px}
.tiLinks a{font-weight:600;color:#1B4F9C}
section.notes{border-bottom:1px solid var(--line);padding-bottom:12px;margin-bottom:14px}
.notesH{margin-top:0}
.noteText{white-space:pre-wrap;background:#FFFBEA;border:1px solid #F3E3A0;border-radius:4px;padding:8px 10px;font-size:14px}
.noteActs{display:flex;justify-content:flex-end;gap:8px;margin-top:8px}
.noteEdit{width:100%;font:14px var(--sans)}
.btn.light{background:#EEF1F4;border-color:#EEF1F4;font-weight:600;color:var(--ink)}
.btn.light:hover{background:#E2E7EC}
.xlinks{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
.xlinks .btn{text-decoration:none}
.btn.disabled{opacity:.45;cursor:not-allowed}
table.kvt.striped tr:nth-child(odd) th,table.kvt.striped tr:nth-child(odd) td{background:#F1F4F7}
table.kvt.striped th{background:transparent;font-weight:400;width:40%}
.sqs{display:inline-block;width:11px;height:11px;border-radius:2px;vertical-align:-1px;margin-right:4px}
button.copy{border:0;background:none;padding:0 2px;color:#1B4F9C;vertical-align:-2px}
button.copy svg{width:15px;height:15px}
.tiTitle{font-size:22px;font-weight:400;margin:6px 0 12px}
.tiTitle span{color:#B5BDC6}
.pilltabs{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:10px}
.pilltabs a{display:flex;align-items:center;gap:7px;padding:10px 16px;border-radius:4px;color:#1B4F9C;font-weight:500}
.pilltabs a:hover{background:#EEF3FA;text-decoration:none}
.pilltabs a.on{background:#2D5A87;color:#fff}
.pilltabs svg{width:15px;height:15px}
.tipbody{padding:4px 0 30px;overflow:visible}
h2.sech{font-size:22px;font-weight:400;margin:14px 0 6px}
h3.subh{font-size:15px;font-weight:400;margin:14px 0 8px;color:#343A40}
table.attrs td:first-child{width:260px}
table.attrs code{white-space:pre-wrap;word-break:break-word}
table.attrs tbody tr:nth-child(odd) td{background:#F7F8F9}
.fchip{background:#E3EEFB;color:#1B4F9C;border-radius:12px;padding:3px 10px;font-size:13px}
.fchip a{margin-left:4px;font-weight:700}

/* ---- DAG page (Airflow-style) ---- */
select,input,textarea{font:inherit;border:1px solid #CED4DA;border-radius:4px;padding:6px 8px;background:#fff;color:var(--ink)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.grow{flex:1}
.dagTop{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin:4px 0 14px}
.dagTitle{font-size:26px;font-weight:400;margin:0;letter-spacing:-.01em;word-break:break-all}
.dagTitle span{color:#B5BDC6}
.hbadge{background:#E9ECEF;border-radius:3px;padding:3px 9px;font-size:13px;color:#495057;white-space:nowrap}
.hbadge b{color:var(--ink);font-weight:600}
.dagTop .acts button,.dagTop .acts .off{width:36px;height:36px}
.fbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;background:#E9ECEF;border-radius:4px;padding:12px 14px}
.fbar input,.fbar select{height:38px;background:#fff}
.fbar #fBase{width:215px}
.btn.ghost{background:#E6F4F8;border:1px solid #7FC7DB;color:#1E7E98;height:38px}
.btn.ghost:disabled{opacity:.55}
.btn.outline{background:#fff;border:1px solid #6E9FE0;color:#1B4F9C;font-weight:600}
.btn.outline:hover{background:#F0F4FA}
.btn.primary{font-weight:600}
.btn.dangerFill{background:#D32F2F;border-color:#D32F2F;color:#fff;font-weight:600}
.btn svg{vertical-align:middle;margin-left:4px}
.legendRow{display:flex;align-items:center;flex-wrap:wrap;gap:6px;padding:12px 2px 10px}
.hint{font-size:12px;color:var(--muted)}
kbd{font:11px var(--code);background:#E9ECEF;border-radius:3px;padding:0 4px;margin:0 1px}
.chip{font-size:11px;border:2px solid;border-radius:4px;padding:0 5px;line-height:18px;color:var(--ink);background:#fff}
.dagBody{display:flex;border-top:1px solid var(--line);height:calc(100vh - 272px);min-height:460px}
.gridPane{flex:0 0 42%;max-width:720px;min-width:320px;overflow:auto;padding:14px 12px 20px 0}
.splitter{width:1px;background:var(--line);flex:none}
.detailPane{flex:1;min-width:0;display:flex;flex-direction:column}
table.agrid{border-collapse:collapse}
table.agrid th,table.agrid td{padding:0}
.agrid .yaxis{position:sticky;left:0;z-index:2;background:#fff;height:150px;min-width:150px;vertical-align:top}
.agrid .ylab{position:absolute;right:10px;font-size:11px;color:var(--muted);font-weight:400;top:28px!important}
.agrid .yv{position:absolute;right:8px;font-size:10px;color:var(--muted);font-weight:400;font-family:var(--code)}
.barcell{height:150px;vertical-align:bottom;position:relative;min-width:18px;background:
  linear-gradient(#E4E7EB,#E4E7EB) 0 50px/100% 1px no-repeat,linear-gradient(#E4E7EB,#E4E7EB) 0 100px/100% 1px no-repeat,linear-gradient(#CED4DA,#CED4DA) 0 100%/100% 1px no-repeat}
.barcell .xlab{position:absolute;left:4px;top:34px;transform:rotate(-40deg);transform-origin:left bottom;white-space:nowrap;font-size:10px;color:var(--muted);pointer-events:none}
.bar{display:block;width:10px;margin:0 auto 1px;border:0;border-radius:2px 2px 0 0;padding:0;position:relative;cursor:pointer}
.bar:hover{filter:brightness(1.1);box-shadow:0 0 0 1px #16202A55}
.bar .manual{position:absolute;bottom:0;left:0;right:0;font-size:8px;color:#fff;font-style:normal;line-height:10px}
.agrid td.sel{background-color:#D6E9FB}
.agrid tr.sel{background:#D6E9FB}
.agrid tr.sel th.tname{background:#D6E9FB}
.agrid th.tname{position:sticky;left:0;z-index:1;background:#fff;text-align:left;font-weight:400;max-width:230px}
.agrid th.tname button{border:0;background:none;padding:3px 10px 3px 12px;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:230px;display:block;text-align:left;color:var(--ink)}
.agrid th.tname button:hover{text-decoration:underline}
.agrid tbody td{height:22px;text-align:center;vertical-align:middle}
.gcell{display:block;width:12px;height:12px;margin:0 auto;border-radius:2px;border:1px solid rgba(0,0,0,.12);padding:0;cursor:pointer}
.gcell:hover{transform:scale(1.25)}
.gcell.on{outline:2px solid #16202A;outline-offset:1px}
.mtag{font-size:11px;color:var(--muted)}
.gempty{color:var(--muted);font-size:13px;padding:10px 12px}
.linkbtn{border:0;background:none;color:var(--action);padding:0;text-decoration:underline}
.paneHead{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:12px 4px 10px 16px;border-bottom:1px solid var(--line)}
.crumbs{display:flex;align-items:flex-end;gap:8px;flex:1 1 560px;min-width:0}
.crumb{display:flex;flex-direction:column;min-width:0;flex:0 1 auto}
.crumb:first-child{flex-shrink:2}
.crumb span{font-size:11px;color:#9AA5B1;line-height:1.2}
.crumb b,.crumb a{font-size:15px;font-weight:600;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}
.crumb a{color:#1B4F9C}
.csep{color:#B5BDC6;font-size:18px;padding-bottom:1px}
.rdot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px;vertical-align:1px}
.pacts{display:flex;gap:8px;flex-wrap:wrap}
.pacts .dd{height:auto}
.pacts .ddm button{display:flex;align-items:center;gap:8px}
.sq{display:inline-block;width:10px;height:10px;border-radius:2px}
.ptabs{display:flex;gap:2px;border-bottom:1px solid var(--line);padding:0 8px;overflow-x:auto;flex:none}
.ptabs a{display:flex;align-items:center;gap:6px;padding:10px 12px;color:var(--ink);font-weight:600;border-bottom:3px solid transparent;white-space:nowrap}
.ptabs a:hover{text-decoration:none;background:#F3F5F7}
.ptabs a.on{color:#1B4F9C;border-bottom-color:#1B4F9C}
.ptabs svg{width:14px;height:14px}
.pbody{flex:1;overflow:auto;padding:14px 16px 24px}
h3.ph{font-size:15px;margin:4px 0 10px}
h3.ph ~ h3.ph{margin-top:22px}
table.kvt{border-collapse:collapse;width:100%;font-size:14px}
table.kvt th{text-align:left;font-weight:600;width:190px;padding:7px 10px;border-bottom:1px solid var(--line);vertical-align:top;background:#FAFBFC}
table.kvt td{padding:7px 10px;border-bottom:1px solid var(--line);word-break:break-word}
table.tbl{border-collapse:collapse;width:100%;font-size:13px}
table.tbl th{text-align:left;background:var(--head);padding:8px;border-bottom:1px solid var(--line);white-space:nowrap}
table.tbl td{padding:7px 8px;border-bottom:1px solid var(--line);vertical-align:top}
table.tbl tr.click{cursor:pointer}
table.tbl tr.click:hover td{background:#F0F4FA}
td.extra{min-width:160px;max-width:380px;word-break:break-word;font-size:12px;color:#495057}
td.nowrap,.nowrap{white-space:nowrap}
code.sm{font-size:11px}
.spill{display:inline-flex;align-items:center;gap:5px;border:2px solid;border-radius:10px;padding:0 8px;font-size:12px;font-weight:600;line-height:18px;background:#fff}
.spill i{width:8px;height:8px;border-radius:50%}
pre.json{background:#F7F8F9;border:1px solid var(--line);border-radius:4px;padding:10px;font:12px/1.5 var(--code);white-space:pre-wrap;word-break:break-word;margin:0}
pre.json.inline{padding:4px 8px}
pre.log{background:#16202A;color:#DCE3EA;padding:12px;border-radius:4px;font:12px/1.5 var(--code);white-space:pre-wrap;word-break:break-word;min-height:200px;max-height:calc(100vh - 420px);overflow:auto;margin:0}
pre.err{background:#FDECEC;color:#8A1F1F;padding:10px;border-radius:4px;font:12px var(--code);white-space:pre-wrap;margin:0 0 14px}
.logHead{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.tries{display:flex;gap:4px;flex-wrap:wrap}
.tries a{border:1px solid #CED4DA;border-radius:4px;padding:4px 12px;font-size:13px;color:var(--ink)}
.tries a:hover{text-decoration:none;background:#F0F4FA}
.tries a.on{background:#1B4F9C;border-color:#1B4F9C;color:#fff}
.graphWrap{overflow:auto;border:1px solid var(--line);border-radius:4px;background:#FAFBFC}
svg .node{cursor:pointer}
svg .node .nt{font:600 12px var(--sans);fill:var(--ink);pointer-events:none}
svg .node .ns{font:11px var(--sans);fill:var(--muted);pointer-events:none}
svg .node:hover rect{filter:drop-shadow(0 1px 3px rgba(0,0,0,.2))}
svg .edge{fill:none;stroke:#9AA5B1;stroke-width:1.4}
.gantt{font-size:12px}
.gaxis,.grow2{display:grid;grid-template-columns:minmax(120px,28%) 1fr;align-items:center}
.gaxis{height:26px;color:var(--muted);font-size:11px;border-bottom:1px solid var(--line)}
.gtrack{position:relative;height:100%}
.gaxis .gtrack span{position:absolute;transform:translateX(-50%);white-space:nowrap;top:6px}
.gaxis .gtrack span:first-child{transform:none}.gaxis .gtrack span:last-child{transform:translateX(-100%)}
.grow2{height:28px;border-bottom:1px solid #F0F2F4}
.grow2.on{background:#D6E9FB}
.gname{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding-right:8px}
.grow2 .gtrack i{position:absolute;top:0;bottom:0;width:1px;background:#EEF0F2}
.gbar{position:absolute;top:7px;height:14px;border-radius:3px;min-width:3px}
.gbar:hover{filter:brightness(1.1);box-shadow:0 0 0 1px #16202A55}
.codeHead{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:10px}
.codeHead .sub{font-size:12px}
.fname{font:12px var(--code);color:var(--muted);margin:10px 0 4px}
.fname b{font:600 13px var(--code);color:var(--ink)}
.rsrc{font-size:12px;font-weight:600;border-radius:3px;padding:2px 8px;background:#E3EEFB;color:#1B4F9C;white-space:nowrap}
.rsrc.on_the_fly{background:#FFF4E0;color:#8A5A00}
.codebox{border:1px solid var(--line);border-radius:4px;background:#F7F8F9;overflow:auto;max-height:calc(100vh - 430px);min-height:200px;font:13px/1.55 var(--code);padding:6px 0}
.codebox .ln{display:flex;white-space:pre}
.codebox .no{flex:none;width:52px;text-align:right;padding-right:14px;color:#8A96A3;font-style:italic;user-select:none;position:sticky;left:0;background:#F7F8F9}
.codebox .tx{padding-right:16px}
.codebox.fit{min-height:0;max-height:60vh;margin-bottom:6px}
.codebox.wrap .ln{white-space:pre-wrap;word-break:break-all}
.codebox .k{color:#A626A4}.codebox .s{color:#2E8B57}.codebox .c{color:#8A96A3;font-style:italic}.codebox .n{color:#B35C00}.codebox .f{color:#1B4F9C}
.dchart{display:flex;height:220px;margin-top:8px}
.dy{display:flex;flex-direction:column;justify-content:space-between;font:10px var(--code);color:var(--muted);padding-right:8px;text-align:right}
.dplot{flex:1;position:relative;display:flex;align-items:flex-end;gap:3px;border-left:1px solid #CED4DA;border-bottom:1px solid #CED4DA;padding:0 4px;background:linear-gradient(#EEF0F2,#EEF0F2) 0 50%/100% 1px no-repeat}
.dbar{flex:1;max-width:28px;border-radius:2px 2px 0 0;min-height:2px}
.dbar.on{outline:2px solid #16202A;outline-offset:1px}
.dplot .avg{position:absolute;left:0;right:0;border-top:1px dashed #8A96A3}
.dx{display:flex;justify-content:space-between;font-size:11px;color:var(--muted);padding-left:60px;margin-top:4px}
dialog .dlgBody p{margin:0 0 10px}
.chkrow{display:flex;gap:18px;flex-wrap:wrap;margin:6px 0 10px}
dialog label.chk{display:inline-flex;align-items:center;gap:6px;margin:0;color:var(--ink);font-size:14px}
dialog label.chk input{width:auto}
.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:0 14px}
.formgrid .span2{grid-column:1/-1;margin-top:12px}
.secHead{display:flex;align-items:center;gap:12px;margin:6px 0 20px}
tr.inactive td{color:#9AA5B1}
.yes{color:var(--s-success);font-weight:700}.no{color:var(--s-failed);font-weight:700}
ul.perms{margin:0;padding-left:18px}
.iconbtn.danger{color:var(--s-failed)}
.stateTag{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600}
.stateTag i{width:10px;height:10px;border-radius:2px;border:1px solid rgba(0,0,0,.12)}
h3{font-size:13px;margin:18px 0 8px}
@media (max-width:1000px){.dagBody{flex-direction:column;height:auto}.gridPane{max-width:none;flex:none;max-height:60vh}.detailPane{min-height:500px}.pbody{overflow:visible}}

dialog{border:1px solid var(--rule);border-radius:8px;padding:0;width:min(520px,94vw)}
dialog::backdrop{background:rgba(22,32,42,.35)}
dialog form{padding:20px}
dialog h2{margin:0 0 12px;font-size:17px}
dialog label{display:block;font-size:13px;margin:12px 0 4px;color:var(--muted)}
dialog textarea{width:100%;height:160px;font:12px var(--code)}
dialog input{width:100%}
dialog .row{display:flex;justify-content:flex-end;gap:8px;margin-top:16px}
.formerr{color:var(--s-failed);font-size:13px;margin-top:8px}

#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:8px 16px;border-radius:6px;font-size:13px;opacity:0;transition:opacity .2s;pointer-events:none}
#toast.show{opacity:1}
.empty{padding:40px;text-align:center;color:var(--muted)}
body:not(.can-User) .needs-User, body:not(.can-Op) .needs-Op, body:not(.can-Admin) .needs-Admin{display:none!important}
.adminForm{display:flex;gap:8px;flex-wrap:wrap;align-items:flex-end;padding:14px;border-top:1px solid #E7EBEF}
.adminForm label{display:flex;flex-direction:column;font-size:12px;color:var(--muted);gap:3px}
/* airflow-style DAG list */
.errbar{background:#E9ECEF;border:1px solid #D6DBE0;border-radius:4px;margin-bottom:18px}
.errbar>button{display:flex;align-items:center;gap:10px;width:100%;border:0;background:none;padding:12px 18px;color:#C62828;font-size:16px;text-align:left}
.errbar>button b{font-weight:400}
.errbar>button::after{content:"⌄";margin-left:auto;color:var(--ink);font-size:18px;line-height:1}
.errbar .ico{width:18px;height:18px;border-radius:50%;background:#E53935;color:#fff;font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center}
.errbar pre{margin:0;padding:0 18px 14px;white-space:pre-wrap;font:12px var(--code);color:#8A1F1F}
.pageTitle{font-size:30px;font-weight:400;margin:6px 0 20px}
.toolbar{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:16px}
.seg{display:inline-flex;border:1px solid #CED4DA;border-radius:4px;overflow:hidden}
.seg a{padding:6px 12px;color:var(--ink);display:flex;align-items:center;gap:8px;border-right:1px solid #CED4DA;font-size:14px}
.seg a:last-child{border-right:0}
.seg a:hover{text-decoration:none;background:#F3F5F7}
.seg a.on{background:var(--pill);color:#fff}
.seg .n{background:#51565C;color:#fff;border-radius:10px;padding:0 7px;font-size:12px;font-weight:700}
.seg a.on .n{background:#fff;color:var(--pill)}
.toolbar .grow{flex:1}
.toolbar input{width:260px;padding:7px 12px;border-color:#CED4DA;border-radius:4px}
.toolbar input.search{width:300px}
.autoref{display:flex;align-items:center;gap:6px;font-size:14px}
.sqbtn{border:1px solid #CED4DA;background:#fff;border-radius:4px;width:36px;height:34px;display:flex;align-items:center;justify-content:center;padding:0;color:var(--ink)}
.sqbtn:hover{background:#F0F4FA}
.sqbtn svg{width:16px;height:16px}
table.dags{width:100%;border-collapse:collapse;font-size:14px}
table.dags th{background:var(--head);text-align:left;font-weight:700;padding:10px 6px;border-top:1px solid var(--line);border-bottom:1px solid var(--line);white-space:nowrap}
table.dags th button.sort{border:0;background:none;padding:0;font-weight:700;display:inline-flex;align-items:center;gap:6px}
table.dags th button.sort::after{content:"⇅";color:#9AA5B1;font-size:12px}
table.dags th button.sort.asc::after{content:"↑";color:var(--ink)}
table.dags th button.sort.desc::after{content:"↓";color:var(--ink)}
table.dags td{padding:9px 6px;border-bottom:1px solid var(--line);vertical-align:middle}
table.dags tr:hover td{background:#FAFBFC}
.dagcell a.dagname{font-family:var(--sans);font-weight:600;color:#1B4F9C;font-size:14px}
.dagcell .tags{margin-top:3px}
.badge{display:inline-block;font-size:11px;padding:1px 6px;border-radius:3px;background:#E3EEFB;color:#1B4F9C;margin-right:4px}
.badge.grey{background:#E9ECEF;color:#495057}
.badge.code{font-family:var(--code);background:#E9ECEF;color:var(--ink);font-size:11px;white-space:nowrap;max-width:150px;overflow:hidden;text-overflow:ellipsis;vertical-align:middle}
.circles{display:flex;gap:2px}
.circ{width:24px;height:24px;border-radius:50%;border:2px solid #DDE1E5;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:600;color:var(--ink);flex:none;background:#fff}
a.circ:hover{text-decoration:none;box-shadow:0 0 0 2px #CFE0F7}
.when{white-space:nowrap;display:inline-flex;align-items:center;gap:6px}
.when i{width:8px;height:8px;border-radius:50%}
.acts{display:flex}
.acts button,.acts a{width:32px;height:32px;border:1px solid #CED4DA;background:#fff;margin-left:-1px;display:flex;align-items:center;justify-content:center;color:#1B4F9C;padding:0}
.acts :first-child{border-radius:4px 0 0 4px;margin-left:0}
.acts :last-child{border-radius:0 4px 4px 0}
.acts button:hover,.acts a:hover{background:#F0F4FA}
.acts .del{color:#D32F2F}
.acts .off{width:32px;height:32px;border:1px solid #CED4DA;background:#F3F5F7;margin-left:-1px;display:flex;align-items:center;justify-content:center;color:#B5BDC6;cursor:not-allowed}
.acts .off svg{width:15px;height:15px}
.acts svg{width:15px;height:15px}
.dd>button.dots3{border:0;background:none;font-size:18px;letter-spacing:1px;padding:2px 8px;color:var(--ink);height:auto}
.dd>button.dots3::after{display:none}
td .dd{height:auto}
.pager{display:flex;align-items:center;gap:12px;justify-content:space-between;padding:12px 4px;color:var(--muted);font-size:13px}
.pager .pgs{display:flex;gap:4px}
.pager button{border:1px solid #CED4DA;background:#fff;border-radius:4px;padding:4px 10px}
.pager button.on{background:var(--pill);color:#fff;border-color:var(--pill)}
.pager button:disabled{opacity:.4;cursor:default}
td .toggle{margin-left:4px}
@media (max-width:1350px){.hideMd{display:none}}
@media (max-width:760px){
  .tblwrap{overflow-x:auto}
  main{padding:14px}
  .hideSm{display:none}
  .sched span{display:none}
  table.list td,table.list th{padding:10px 8px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}.cell:hover{transform:none}}
</style>
</head>
<body>
<header class="top">
  <a class="brand" href="#/"><svg width="26" height="26" viewBox="0 0 26 26" aria-hidden="true"><path d="M7 8 L13 18 M19 8 L13 18 M7 8 L19 8" stroke="#8FA3B8" stroke-width="2" fill="none"/><circle cx="7" cy="8" r="4" fill="#0F6FDE"/><circle cx="19" cy="8" r="4" fill="#2E9B57"/><circle cx="13" cy="19" r="4.5" fill="#F0A020"/></svg>dagsflow</a>
  <nav class="menu" aria-label="Main">
    <a href="#/" data-nav="dags">DAGs</a>
    <a href="#/admin?tab=datasets" data-nav="datasets">Datasets</a>
    <div class="dd" data-nav="security"><button type="button" aria-haspopup="true">Security</button><div class="ddm"><a class="needs-Admin" href="#/admin?tab=users">List Users</a><a href="#/admin?tab=roles">List Roles</a></div></div>
    <div class="dd" data-nav="browse"><button type="button" aria-haspopup="true">Browse</button><div class="ddm"><a href="#/admin?tab=tis">Task Instances</a><a href="#/admin?tab=events">Event Log</a><a href="#/admin?tab=errors">DAG Import Errors</a></div></div>
    <div class="dd" data-nav="admin"><button type="button" aria-haspopup="true">Admin</button><div class="ddm"><a href="#/admin?tab=pools">Pools</a><a class="needs-Op" href="#/admin?tab=variables">Variables</a><a class="needs-Op" href="#/admin?tab=connections">Connections</a></div></div>
  </nav>
  <div class="sched" id="sched" title="Scheduler status"><i></i><span>Checking scheduler…</span></div>
  <span class="clock" id="clock"></span>
  <div class="dd" id="userMenu" hidden><button type="button" class="userBtn" aria-haspopup="true" aria-label="Account"><span class="avatar" id="avatar"></span></button>
    <div class="ddm right"><div class="info" id="who"></div><button type="button" id="logoutBtn">Log out</button></div></div>
</header>
<main id="app"></main>

<dialog id="triggerDlg">
  <form method="dialog" id="triggerForm">
    <h2>Trigger <span class="id" id="trgDag"></span></h2>
    <label for="trgConf">Run config (JSON, overrides DAG params)</label>
    <textarea id="trgConf" spellcheck="false"></textarea>
    <label for="trgRunId">Run ID (optional)</label>
    <input id="trgRunId" placeholder="Generated automatically">
    <div class="formerr" id="trgErr" role="alert"></div>
    <div class="row">
      <button class="btn" value="cancel" formnovalidate>Cancel</button>
      <button class="btn primary" id="trgGo" value="go">Trigger run</button>
    </div>
  </form>
</dialog>
<dialog id="actDlg"></dialog>
<div id="toast" role="status" aria-live="polite"></div>

<script>
const STATES = ["success","running","queued","up_for_retry","up_for_reschedule","failed","upstream_failed","skipped","none"];
const $app = document.getElementById("app");
let refreshTimer = null;

// ---- utilities -------------------------------------------------------------
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const st = s => (s && s !== "") ? s : "none";
const color = s => `var(--s-${st(s)})`;
const enc = encodeURIComponent;
function fmt(t){ if(!t) return "–"; const d=new Date(t); if(isNaN(d)||d.getFullYear()<2) return "–";
  const p=n=>String(n).padStart(2,"0");
  return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}, ${p(d.getHours())}:${p(d.getMinutes())}:${p(d.getSeconds())}`; }
function dur(a,b){ if(!a) return "–"; const ms=(b?new Date(b):new Date())-new Date(a); if(ms<0) return "–";
  const s=Math.round(ms/1000); if(s<60) return s+"s"; const m=Math.floor(s/60); if(m<60) return `${m}m ${s%60}s`; return `${Math.floor(m/60)}h ${m%60}m`; }
function toast(msg){ const t=document.getElementById("toast"); t.textContent=msg; t.classList.add("show"); clearTimeout(t._h); t._h=setTimeout(()=>t.classList.remove("show"),2600); }
async function api(path, opts={}){
  const res = await fetch("/api/v1"+path, {...opts, headers:{"Content-Type":"application/json","X-Dagsflow":"1",...(opts.headers||{})}});
  if(res.status===401 && path!=="/login"){ location.href = "/login?next="+encodeURIComponent(location.hash||"#/"); throw new Error("Please sign in"); }
  if(res.status===204) return null;
  if(!res.ok){ let m=res.statusText; try{ m=(await res.json()).error||m }catch{} throw new Error(m); }
  const ct=res.headers.get("Content-Type")||"";
  return ct.includes("json") ? res.json() : res.text();
}
const post = (path, body, method="POST") => api(path, {method, body:JSON.stringify(body||{})});
const ME = {role:"Viewer"}; const can = r => ({Viewer:1,User:2,Op:3,Admin:4})[ME.role] >= ({Viewer:1,User:2,Op:3,Admin:4})[r];
const stateTag = s => `<span class="stateTag"><i style="background:${color(s)}"></i>${esc(st(s))}</span>`;
const legend = () => `<div class="legend">${STATES.map(s=>`<span><i class="dot" style="background:${color(s)}"></i>${s}</span>`).join("")}</div>`;
const route = () => { const [path,q] = location.hash.slice(1).split("?"); return {parts:(path||"/").split("/").filter(Boolean).map(decodeURIComponent), q:new URLSearchParams(q||"")}; };
function setQuery(k,v){ const r=route(); v==null?r.q.delete(k):r.q.set(k,v); location.hash="#/"+r.parts.map(enc).join("/")+(r.q.toString()?"?"+r.q:""); }

// ---- scheduler status ------------------------------------------------------
async function health(){
  const el=document.getElementById("sched");
  try{ const h=await api("/health");
    el.className="sched "+(h.scheduler_alive?"alive":"dead");
    el.querySelector("span").textContent = h.scheduler_alive ? `Scheduler running (pid ${h.scheduler_pid})` : "Scheduler not running: queued runs will wait";
  }catch{ el.className="sched dead"; el.querySelector("span").textContent="Webserver unreachable"; }
}

// ---- DAG list (Airflow-style) -----------------------------------------------
const RUN_STATES = ["queued","success","running","failed"];
const TASK_STATES = ["success","running","failed","upstream_failed","skipped","up_for_retry","up_for_reschedule","queued","none"];
const ICON = {
  play:'<svg viewBox="0 0 16 16"><path d="M4 2.5v11l9-5.5z" fill="currentColor"/></svg>',
  grid:'<svg viewBox="0 0 16 16" fill="currentColor"><rect x="1" y="1" width="6" height="6" rx="1"/><rect x="9" y="1" width="6" height="6" rx="1"/><rect x="1" y="9" width="6" height="6" rx="1"/><rect x="9" y="9" width="6" height="6" rx="1"/></svg>',
  trash:'<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M2.5 4h11M6 4V2.5h4V4M4 4l.8 9.5h6.4L12 4"/></svg>',
  pencil:'<svg viewBox="0 0 16 16" width="13" height="13" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M11 2.5l2.5 2.5L6 12.5 3 13l.5-3z"/></svg>',
  refresh:'<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M13.5 8a5.5 5.5 0 1 1-1.6-3.9M13.5 2v3.5H10"/></svg>',
};
let listData = null;
const PAGE = 25;
const qget = (k,d="") => route().q.get(k) ?? d;
const circ = (state, n, title, href) => {
  const style = n ? `border-color:${color(state)}` : "";
  const inner = n ? (n>999?Math.round(n/1000)+"k":n) : "";
  const t = `${title}: ${n||0}`;
  return href && n ? `<a class="circ" href="${href}" style="${style}" title="${esc(t)}" aria-label="${esc(t)}">${inner}</a>`
                   : `<span class="circ" style="${style}" title="${esc(t)}" aria-label="${esc(t)}">${inner}</span>`;
};
function filteredDags(){
  const status = qget("status","all"), last = qget("last"), tag = qget("tags").trim().toLowerCase(), search = qget("search").trim().toLowerCase();
  let rows = listData.dags.filter(d =>
    (status==="all" || (status==="active") === !d.is_paused) &&
    (!last || (last==="running" ? d.active_runs>0 : d.last_run?.state==="failed")) &&
    (!tag || d.tags.some(t=>t.toLowerCase().includes(tag))) &&
    (!search || d.dag_id.toLowerCase().includes(search) || d.owner.toLowerCase().includes(search)));
  const sort = qget("sort","dag_id"), dir = qget("dir","asc")==="desc" ? -1 : 1;
  const key = {dag_id:d=>d.dag_id, owner:d=>d.owner, last_run:d=>d.last_run?.logical_date||"", next_run:d=>d.next_data_interval_start||""}[sort] || (d=>d.dag_id);
  rows.sort((a,b)=> key(a)<key(b) ? -dir : key(a)>key(b) ? dir : 0);
  return rows;
}
function listHref(changes){
  const r = route(); for(const [k,v] of Object.entries(changes)) (v===""||v==null) ? r.q.delete(k) : r.q.set(k,v);
  if(!("page" in changes)) r.q.delete("page");
  return "#/"+(r.q.toString()?"?"+r.q:"");
}
async function viewList(){
  listData = await api("/dags");
  const tb = document.getElementById("dagToolbar"), f = document.activeElement;
  if(tb && f && tb.contains(f) && f.tagName==="INPUT"){ renderListTable(); return; } // keep focus while typing
  const errs = Object.entries(listData.import_errors||{});
  const all = listData.dags, act = all.filter(d=>!d.is_paused).length;
  const running = all.filter(d=>d.active_runs>0).length, failed = all.filter(d=>d.last_run?.state==="failed").length;
  const status = qget("status","all"), last = qget("last");
  const seg = (k,v,label,n,cur) => `<a href="${listHref({[k]: cur===v && k==="last" ? "" : v})}" class="${cur===v?"on":""}">${label} <span class="n">${n}</span></a>`;
  $app.innerHTML = `
    ${errs.length?`<div class="errbar"><button type="button" aria-expanded="false" onclick="const p=this.nextElementSibling;p.hidden=!p.hidden;this.setAttribute('aria-expanded',!p.hidden)"><span class="ico">!</span><b>DAG Import Errors (${errs.length})</b></button><pre hidden>${errs.map(([k,v])=>esc(k+"\n"+v)).join("\n\n")}</pre></div>`:""}
    <h1 class="pageTitle">DAGs</h1>
    <div class="toolbar" id="dagToolbar">
      <div class="seg" role="group" aria-label="Filter by state">${seg("status","all","All",all.length,status)}${seg("status","active","Active",act,status)}${seg("status","paused","Paused",all.length-act,status)}</div>
      <div class="seg" role="group" aria-label="Filter by last run">${seg("last","running","Running",running,last)}${seg("last","failed","Failed",failed,last)}</div>
      <span class="grow"></span>
      <input id="tagFilter" placeholder="Filter DAGs by tag" value="${esc(qget("tags"))}" aria-label="Filter DAGs by tag">
      <input id="dagSearch" class="search" placeholder="Search DAGs" value="${esc(qget("search"))}" aria-label="Search DAGs">
      <label class="autoref"><button type="button" class="toggle" role="switch" id="autoRef" aria-checked="${autoRefresh()}" aria-label="Auto-refresh"></button>Auto-refresh</label>
      <button type="button" class="sqbtn" id="refreshBtn" title="Refresh" aria-label="Refresh">${ICON.refresh}</button>
    </div>
    <div id="dagTable"></div>`;
  renderListTable();
}
function renderListTable(){
  const box = document.getElementById("dagTable"); if(!box) return;
  const rows = filteredDags(), total = rows.length;
  const pages = Math.max(1, Math.ceil(total/PAGE)), page = Math.min(pages, Math.max(1, +qget("page","1")||1));
  const shown = rows.slice((page-1)*PAGE, page*PAGE);
  const sort = qget("sort","dag_id"), dir = qget("dir","asc");
  const sh = (k,label) => `<button type="button" class="sort ${sort===k?dir:""}" data-sort="${k}">${label}</button>`;
  if(!listData.dags.length){ box.innerHTML = `<div class="panel empty">No DAGs yet. Put a <code>.go</code> or <code>.yaml</code> file in the DAG folder; it is picked up within the rescan interval.</div>`; return; }
  let h = `<div class="tblwrap"><table class="dags"><thead><tr>
    <th style="width:50px"><span class="sr" title="Pause/unpause">&nbsp;</span></th><th>${sh("dag_id","DAG")}</th><th class="hideMd">${sh("owner","Owner")}</th>
    <th>Runs</th><th>Schedule</th><th>${sh("last_run","Last Run")}</th><th class="hideMd">${sh("next_run","Next Run")}</th>
    <th class="hideMd">Recent Tasks</th><th style="text-align:center">Actions</th><th>Links</th></tr></thead><tbody>`;
  for(const d of shown){
    const id = enc(d.dag_id), lr = d.last_run;
    h += `<tr>
      <td><button class="toggle needs-User" role="switch" aria-checked="${!d.is_paused}" aria-label="${d.is_paused?"Unpause":"Pause"} ${esc(d.dag_id)}" data-pause="${esc(d.dag_id)}" data-paused="${d.is_paused}"></button></td>
      <td class="dagcell"><a class="dagname" href="#/dags/${id}">${esc(d.dag_id)}</a>
        <div class="tags">${d.source!=="go"?`<span class="badge grey" title="${esc(d.source)}">${/\.ya?ml$/.test(d.source)?"yaml":"go"}</span>`:`<span class="badge grey" title="builtin_dags/: compiled into the binary">built-in</span>`}${d.tags.map(t=>`<a class="badge" href="${listHref({tags:t})}">${esc(t)}</a>`).join("")}</div></td>
      <td class="hideMd"><span class="badge grey">${esc(d.owner)}</span></td>
      <td><div class="circles">${RUN_STATES.map(s=>circ(s, d.run_counts[s]||0, s, `#/dags/${id}?tab=runs`)).join("")}</div></td>
      <td><span class="badge code" title="${esc(d.schedule)}">${esc(d.schedule.startsWith("datasets")?"Dataset":d.schedule)}</span></td>
      <td>${lr?`<a class="when" href="#/dags/${id}?tab=grid&run=${enc(lr.dag_run_id)}" title="${esc(lr.dag_run_id)} (${esc(lr.state)})"><i style="background:${color(lr.state)}"></i>${fmt(lr.logical_date)}</a>`:""}</td>
      <td class="hideMd"><span class="when">${d.schedule.startsWith("datasets")?"On dataset update":d.is_paused&&!d.next_data_interval_start?"":fmt(d.next_data_interval_start).replace("–","")}</span></td>
      <td class="hideMd"><div class="circles">${TASK_STATES.map(s=>circ(s, d.recent_task_counts[s]||0, s)).join("")}</div></td>
      <td><div class="acts" style="justify-content:center">
        <button class="needs-User" data-trigger="${esc(d.dag_id)}" title="Trigger DAG" aria-label="Trigger ${esc(d.dag_id)}">${ICON.play}</button>
        ${d.source!=="go"
          ? `<button class="needs-User" data-reparse="${esc(d.dag_id)}" title="Reparse DAG" aria-label="Reparse ${esc(d.dag_id)}">${PI.reparse}</button>`
          : `<span class="off" title="Compiled into the binary: rebuild to change it">${PI.reparse}</span>`}
        <button class="del needs-Op" data-deldag="${esc(d.dag_id)}" title="Delete DAG runs and logs" aria-label="Delete ${esc(d.dag_id)} metadata">${ICON.trash}</button></div></td>
      <td><div class="dd"><button type="button" class="dots3" aria-haspopup="true" aria-label="Links for ${esc(d.dag_id)}">···</button>
        <div class="ddm right"><a href="#/dags/${id}?tab=grid">Grid</a><a href="#/dags/${id}?tab=graph">Graph</a><a href="#/dags/${id}?tab=runs">Runs</a><a href="#/dags/${id}?tab=details">Details</a></div></div></td>
    </tr>`;
  }
  if(!shown.length) h += `<tr><td colspan="10" class="empty">No DAGs match these filters. <a href="#/">Clear filters</a></td></tr>`;
  h += `</tbody></table></div>`;
  const nums = []; for(let i=Math.max(1,page-2); i<=Math.min(pages,page+2); i++) nums.push(i);
  h += `<div class="pager"><span>Showing ${total?(page-1)*PAGE+1:0}–${Math.min(page*PAGE,total)} of ${total} DAGs</span>
    <span class="pgs"><button data-page="${page-1}" ${page<=1?"disabled":""} aria-label="Previous page">‹</button>${nums.map(n=>`<button data-page="${n}" class="${n===page?"on":""}">${n}</button>`).join("")}<button data-page="${page+1}" ${page>=pages?"disabled":""} aria-label="Next page">›</button></span></div>`;

function selection(q){
  const run = q.get("run")||"", task = q.get("task")||"", mi = q.get("mi")!=null && q.get("mi")!=="" ? +q.get("mi") : -1;
  const kind = run && task ? "ti" : run ? "run" : task ? "task" : "dag";
  return {run, task, mi, kind};
}
function tabsFor(sel, taskDef, ti){
  switch(sel.kind){
    case "dag": return ["details","graph","code","events"];
    case "run": return ["details","graph","gantt","code","events"];
    case "task": return ["details","graph","duration","code","events"];
  }
  const t = ["details","graph","gantt","code","events"];
  const expanded = (DV.run?.mapped_task_instances?.[sel.task]||[]).length > 0;
  if(taskDef?.is_mapped && sel.mi < 0 && expanded) t.splice(1,0,"mapped"); else t.push("logs","xcom");
  t.push("duration");
  return t;
}

// ---- task filter ("Filter DAG by task") --------------------------------------
function visibleTasks(d, q){
  const f = q.get("filter_task"), mode = q.get("filter_mode")||"both";
  if(!f || !d.tasks.some(t=>t.task_id===f)) return d.tasks;
  const up = {}, down = {};
  d.tasks.forEach(t=>{ up[t.task_id] = t.upstream; t.upstream.forEach(u=>(down[u] ||= []).push(t.task_id)); });
  const keep = new Set([f]);
  const walk = (id, g) => (g[id]||[]).forEach(n=>{ if(!keep.has(n)){ keep.add(n); walk(n, g); } });
  if(mode!=="down") walk(f, up);
  if(mode!=="up") walk(f, down);
  return d.tasks.filter(t=>keep.has(t.task_id));
}
function relatives(d, id, dir){ // upstream (dir="up") or downstream task ids, transitive
  const g = {}; d.tasks.forEach(t=>{ if(dir==="up") g[t.task_id] = t.upstream; else t.upstream.forEach(u=>(g[u] ||= []).push(t.task_id)); });
  const out = new Set(); const walk = x => (g[x]||[]).forEach(n=>{ if(!out.has(n)){ out.add(n); walk(n); } }); walk(id); return [...out];
}

// ---- grid -------------------------------------------------------------------------
function renderGrid(d, q){
  const pane = document.getElementById("gridPane");
  const atRight = pane.scrollLeft + pane.clientWidth >= pane.scrollWidth - 8, keepX = pane.scrollLeft, keepY = pane.scrollTop;

  let h = `<table class="agrid"><thead><tr class="chartRow"><th class="yaxis"><span class="ylab" style="top:0">Duration</span>
      <span class="yv" style="top:42px">${hms(maxS)}</span><span class="yv" style="top:92px">${hms(maxS/2)}</span><span class="yv" style="top:140px">00:00:00</span></th>`;
  runs.forEach((r,i)=>{

// ---- details pane -------------------------------------------------------------------
async function renderPane(d, q){
  const pane = document.getElementById("detailPane"), sel = selection(q);
  const taskDef = d.tasks.find(t=>t.task_id===sel.task);
  if(sel.task && !taskDef){ goDag({task:null, mi:null}); return; }
  let run = null;
  if(sel.run){ try{ run = await api(`/dags/${enc(d.dag_id)}/dagRuns/${enc(sel.run)}`); }catch{ goDag({run:null}); return; } }
  DV.run = run;
  const ti = run && sel.task ? (sel.mi>=0 ? (run.mapped_task_instances?.[sel.task]||[])[sel.mi] : run.task_instances[sel.task]) : null;
  const tabs = tabsFor(sel, taskDef, ti);
  const tab = tabs.includes(q.get("tab")) ? q.get("tab") : "details";
  const key = JSON.stringify([d.dag_id, sel, tab]);
  const fresh = key !== DV.paneKey;
  if(fresh){
    pane.innerHTML = `<div class="paneHead" id="paneHead"></div><nav class="ptabs" role="tablist">${tabs.map(t=>
      `<a href="${dagHref({tab:t})}" role="tab" aria-selected="${t===tab}" class="${t===tab?"on":""}">${PI[t]}${TAB_LABEL[t]}</a>`).join("")}</nav><div class="pbody" id="pbody"></div>`;
    DV.paneKey = key;
  }
  document.getElementById("paneHead").innerHTML = paneHead(d, sel, run, ti, taskDef);
  const body = document.getElementById("pbody"), y = body.scrollTop;
  if(!fresh && (tab==="code" || ((tab==="xcom" || tab==="rendered") && !LIVE.includes(ti?.state)))) return; // static: keep scroll/selection
  if(tab==="logs"){ await renderLogs(d, sel, run, ti, q, fresh); return; }
  let html = "";
  switch(tab){
    case "details": html = sel.kind==="dag" ? dagDetails(d) : sel.kind==="run" ? runDetails(d, run) : sel.kind==="task" ? taskDetails(d, taskDef) : tiDetails(d, run, ti, taskDef, sel); break;
    case "graph": html = graphTab(d, run, sel); break;
    case "gantt": html = ganttTab(d, run, sel); break;
    case "code": html = await codeTab(d); break;
    case "events": html = await eventsTab(d, sel); break;
    case "xcom": html = xcomTab(run, sel); break;
    case "rendered": html = await renderedTab(d, sel); break;
    case "duration": html = durationTab(d, sel); break;
    case "mapped": html = mappedTab(run, sel); break;
  }
  body.innerHTML = html;
  if(!fresh) body.scrollTop = y;
}

function paneHead(d, sel, run, ti, taskDef){
  const crumb = (label, val, href) => { const t = esc(val.replace(/<[^>]*>/g,""));
    return `<div class="crumb"><span>${label}</span>${href?`<a href="${href}" title="${t}">${val}</a>`:`<b title="${t}">${val}</b>`}</div>`; };
  let h = `<div class="crumbs">${crumb("DAG", esc(d.dag_id), sel.kind!=="dag" ? dagHref({run:null,task:null,mi:null}) : "")}`;
  if(sel.run) h += `<span class="csep">/</span>${crumb("Run", `<i class="rdot" style="background:${color(run?.state)}"></i>${esc(fmtZ(run?.logical_date))}`, sel.task ? dagHref({task:null,mi:null}) : "")}`;
  if(sel.task) h += `<span class="csep">/</span>${crumb("Task", esc(sel.task)+(sel.mi>=0?` [${sel.mi}]`:""), sel.mi>=0 ? dagHref({mi:null}) : "")}`;
  h += `</div><div class="pacts">`;
  const markMenu = `<div class="dd"><button type="button" class="btn primary needs-User" aria-haspopup="true">Mark state as… ${PI.caret}</button>
      <div class="ddm right"><button data-act="mark" data-state="success"><i class="sq" style="background:var(--s-success)"></i>success</button><button data-act="mark" data-state="failed"><i class="sq" style="background:var(--s-failed)"></i>failed</button></div></div>`;
  if(sel.kind==="ti") h += `<button class="btn primary needs-User" data-act="clear">Clear task</button>${markMenu}`;
  if(sel.kind==="run") h += `<button class="btn primary needs-User" data-act="clear">Clear existing tasks</button>${markMenu}`;
  if(sel.task) h += `<div class="dd"><button type="button" class="btn outline" aria-haspopup="true">Filter DAG by task ${PI.caret}</button>
      <div class="ddm right"><button data-act="filter" data-mode="up">Only upstream</button><button data-act="filter" data-mode="down">Only downstream</button><button data-act="filter" data-mode="both">Both upstream &amp; downstream</button>${new URLSearchParams(location.hash.split("?")[1]||"").get("filter_task")?'<button data-act="unfilter">Reset filter</button>':""}</div></div>`;
  return h + `</div>`;
}

// ---- tab: graph -------------------------------------------------------------------
function graphTab(d, run, sel){
  run = run || null;
  const latest = run ? null : d.runs[d.runs.length-1];
  const stateOf = id => run ? run.task_instances[id]?.state : latest?.task_states?.[id];
  const tasks = d.tasks, layer = {};
  for(const t of tasks) layer[t.task_id] = t.upstream.length ? Math.max(...t.upstream.map(u=>layer[u]+1)) : 0;
  const cols = []; for(const t of tasks) (cols[layer[t.task_id]] ||= []).push(t.task_id);
  const W=190, H=40, GX=60, GY=18, pos={};
  cols.forEach((c,x)=>c.forEach((id,y)=>pos[id]={x:16+x*(W+GX), y:16+y*(H+GY)}));
  const width = 32+cols.length*(W+GX)-GX, height = 32+Math.max(1,...cols.map(c=>c.length))*(H+GY)-GY;
  let edges = "", nodes = "";
  for(const t of tasks) for(const u of t.upstream){
    const a=pos[u], b=pos[t.task_id], x1=a.x+W, y1=a.y+H/2, x2=b.x, y2=b.y+H/2, mx=(x1+x2)/2;
    edges += `<path class="edge" d="M${x1},${y1} C${mx},${y1} ${mx},${y2} ${x2},${y2}" marker-end="url(#arr)"/>`;
  }
  for(const t of tasks){
    const p = pos[t.task_id], s = st(stateOf(t.task_id)), label = t.task_id.length>22 ? t.task_id.slice(0,21)+"…" : t.task_id;
    const kind = t.is_sensor?"Sensor":t.is_branch?"Branch":t.is_mapped?"Mapped":"Task";
    nodes += `<g class="node ${t.task_id===sel.task?"on":""}" tabindex="0" role="button" data-seltask="${esc(t.task_id)}" aria-label="${esc(t.task_id)}: ${s}">
      <title>${esc(t.task_id)} (${s})</title><rect x="${p.x}" y="${p.y}" width="${W}" height="${H}" rx="4" fill="#fff" stroke="${s==="none"?"#B8C2CC":color(s)}" stroke-width="${t.task_id===sel.task?3:2}"/>
      <text x="${p.x+10}" y="${p.y+17}" class="nt">${esc(label)}</text><text x="${p.x+10}" y="${p.y+32}" class="ns">${kind} · ${s==="none"?"no status":s}</text></g>`;
  }
  return `<p class="sub">${run?`Colored by run <code>${esc(run.run_id)}</code>.`:latest?`Colored by the latest run <code>${esc(latest.dag_run_id)}</code>.`:"No runs yet: structure only."} Select a task to see its details.</p>
    <div class="graphWrap"><svg width="${width}" height="${height}" viewBox="0 0 ${width} ${height}" role="img" aria-label="Task dependency graph">
    <defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#9AA5B1"/></marker></defs>${edges}${nodes}</svg></div>`;
}

// ---- tab: gantt -------------------------------------------------------------------
function ganttTab(d, run, sel){
  if(!run?.start_date) return `<div class="empty">This run has not started yet.</div>`;
  const rows = [];
  for(const t of visibleTasks(d, route().q)){
    const kids = run.mapped_task_instances?.[t.task_id] || [];
    const ti = run.task_instances[t.task_id]; if(!ti) continue;
    rows.push({id:t.task_id, ti, n:kids.length});
  }
  const t0 = new Date(run.start_date).getTime();
  const t1 = Math.max(t0+1000, ...rows.map(r=>r.ti.start_date ? new Date(r.ti.end_date||Date.now()).getTime() : 0), run.end_date ? new Date(run.end_date).getTime() : Date.now());
  const span = t1 - t0, ticks = [0,.25,.5,.75,1];
  let h = `<div class="gantt"><div class="gaxis"><span></span><div class="gtrack">${ticks.map(f=>`<span style="left:${f*100}%">${new Date(t0+f*span).toLocaleTimeString([], {hour:"2-digit",minute:"2-digit",second:"2-digit",hour12:false})}</span>`).join("")}</div></div>`;
  for(const r of rows){
    const s = st(r.ti.state);
    let bar = "";
    if(r.ti.start_date){
      const a = (new Date(r.ti.start_date).getTime()-t0)/span*100, b = (new Date(r.ti.end_date||Date.now()).getTime()-t0)/span*100;
      bar = `<a class="gbar" href="${dagHref({task:r.id, mi:null})}" style="left:${Math.max(0,a)}%;width:${Math.max(.6,b-a)}%;background:${color(s)}" title="${esc(r.id)}: ${s}&#10;${fmtZ(r.ti.start_date)} → ${fmtZ(r.ti.end_date)}&#10;${hms(secs(r.ti.start_date, r.ti.end_date))}"></a>`;
    }
    h += `<div class="grow2 ${r.id===sel.task?"on":""}"><span class="gname"><code>${esc(r.id)}</code>${r.n?` <span class="mtag">[${r.n}]</span>`:""}</span><div class="gtrack">${ticks.map(f=>`<i style="left:${f*100}%"></i>`).join("")}${bar}</div></div>`;
  }
  return h + `</div><p class="sub">Bars span each task instance's start and end within the run (${hms(span/1000)} total).</p>`;
}

// ---- tab: code --------------------------------------------------------------------
const GO_KW = new Set("break case chan const continue default defer else fallthrough for func go goto if import interface map package range return select struct switch type var nil true false".split(" "));
const SQL_KW = new Set("select from where and or not in is null as join left right inner outer full cross on group by order having limit offset union all distinct insert into values update set delete merge using when matched then else end case create replace table view with partition cluster struct array cast safe_cast if exists true false interval date datetime timestamp current_date current_timestamp between like qualify over window declare begin commit rollback truncate drop alter add column temp temporary unnest".split(" "));
const SH_KW = new Set("if then else elif fi for while until do done case esac in function return exit echo export local set unset true false source cd".split(" "));
function hlOther(line, lang){
  const out = []; const push = (cls, txt) => out.push(cls ? `<span class="${cls}">${esc(txt)}</span>` : esc(txt));
  let rx, last = 0, m;
  if(lang==="json") rx = /("(?:[^"\\]|\\.)*")(\s*:)?|\b(true|false|null)\b|(-?\b\d+(?:\.\d+)?)/g;
  else if(lang==="sql") rx = /(--.*$)|('(?:[^']|'')*'?|`[^`]*`?)|\b([A-Za-z_]\w*)\b|\b(\d+(?:\.\d+)?)\b/g;
  else rx = /((?:^|\s)#.*$)|("(?:[^"\\]|\\.)*"|'[^']*')|(\$\{?\w+\}?)|\b([A-Za-z_][\w-]*)\b/g;
  while((m = rx.exec(line))){
    push("", line.slice(last, m.index));
    if(lang==="json"){ if(m[1]){ push(m[2] ? "k" : "s", m[1]); if(m[2]) push("", m[2]); } else push("n", m[3]||m[4]); }
    else if(lang==="sql"){ if(m[1]) push("c", m[1]); else if(m[2]) push("s", m[2]); else if(m[3]) push(SQL_KW.has(m[3].toLowerCase()) ? "k" : line[m.index+m[3].length]==="(" ? "f" : "", m[3]); else push("n", m[4]); }
    else { if(m[1]) push("c", m[1]); else if(m[2]) push("s", m[2]); else if(m[3]) push("n", m[3]); else push(SH_KW.has(m[4]) ? "k" : "", m[4]); }
    last = rx.lastIndex; if(m[0]==="") rx.lastIndex++;
  }
  push("", line.slice(last));
  return out.join("");
}
function codeBox(text, lang, fit){
  const wrap = localStorage.getItem("dagsflow.wrap")==="on", state = {raw:false};
  const lines = String(text).replace(/\n$/,"").split("\n");
  const hl = l => lang==="go"||lang==="yaml" ? hlLine(l, lang, state) : lang==="text" ? esc(l) : hlOther(l, lang);
  return `<div class="codebox ${wrap?"wrap":""} ${fit?"fit":""}">${lines.map((l,i)=>`<div class="ln"><span class="no">${i+1}</span><span class="tx">${hl(l)||" "}</span></div>`).join("")}</div>`;
}
async function renderedTab(d, sel){
  const v = await api(`/dags/${enc(d.dag_id)}/dagRuns/${enc(sel.run)}/taskInstances/${enc(sel.task)}/rendered${sel.mi>=0?`?map_index=${sel.mi}`:""}`);
  if(v.source==="none") return `<div class="empty">${esc(v.note)}</div>`;
  const wrap = localStorage.getItem("dagsflow.wrap")==="on";
  let h = `<div class="codeHead"><span class="rsrc ${v.source}">${v.source==="recorded"?"Recorded at run time":"Rendered on the fly"}</span>
    <span class="sub">${v.source==="recorded"?"The values this task instance used when it ran.":esc(v.note||"")}</span><span class="grow"></span>
    <button class="btn outline" data-act="wrap" aria-pressed="${wrap}">Toggle Wrap</button></div>`;
  if(!v.fields.length) return h + `<div class="empty">This task has no templated fields.<br><span class="sub">Custom Go tasks can declare one with <code>dag.WithTemplateField("sql", raw, "sql")</code> and render it with <code>ctx.RenderTemplateField("sql")</code>.</span></div>`;
  for(const f of v.fields){
    h += `<div class="fname"><b>${esc(f.name)}</b></div>` + (f.error ? `<pre class="err">${esc(f.error)}</pre>` : codeBox(f.value, f.lang||"text", true));
  }
  return h;
}
function hlLine(line, lang, state){
  const out = []; let i = 0;
  const push = (cls, txt) => out.push(cls ? `<span class="${cls}">${esc(txt)}</span>` : esc(txt));
  if(state.raw){ const e = line.indexOf("`"); if(e<0){ push("s", line); return out.join(""); } push("s", line.slice(0,e+1)); i = e+1; state.raw = false; }
  const rx = lang==="yaml"
    ? /(#.*$)|("(?:[^"\\]|\\.)*"|'[^']*')|^(\s*-?\s*)([\w.-]+)(?=\s*:)|\b(true|false|null|\d+(?:\.\d+)?)\b/g
    : /(\/\/.*$)|("(?:[^"\\]|\\.)*"|'(?:[^'\\]|\\.)*')|(`[^`]*`?)|\b([A-Za-z_]\w*)\b|\b(\d+(?:\.\d+)?)\b/g;
  rx.lastIndex = i; let m, last = i;
  while((m = rx.exec(line))){
    push("", line.slice(last, m.index));
    if(lang==="yaml"){
      if(m[1]) push("c", m[1]); else if(m[2]) push("s", m[2]); else if(m[4]){ push("", m[3]); push("k", m[4]); } else push("n", m[5]);
    } else {
      if(m[1]) push("c", m[1]); else if(m[2]) push("s", m[2]);
      else if(m[3]){ push("s", m[3]); if(m[3].length===1 || !m[3].endsWith("`")) state.raw = true; }
      else if(m[4]) push(GO_KW.has(m[4]) ? "k" : line[m.index+m[4].length]==="(" ? "f" : "", m[4]);
      else push("n", m[5]);
    }
    last = rx.lastIndex; if(m[0]==="") rx.lastIndex++;
  }
  push("", line.slice(last));
  return out.join("");
}
async function codeTab(d){
  if(!DV.code || DV.code.dag !== d.dag_id || DV.code.parsed !== d.parsed_at){
    DV.code = {dag:d.dag_id, parsed:d.parsed_at, data: await api(`/dags/${enc(d.dag_id)}/source`)};
  }
  const src = DV.code.data;
  const wrap = localStorage.getItem("dagsflow.wrap")==="on";
  let h = `<div class="codeHead"><b>Parsed at: ${fmtZ(src.parsed_at)}</b>${src.is_file_source?`<span class="sub">Loaded from the DAG folder. Edit the file, then use <b>Reparse</b> (or wait for the rescan).</span>`:`<span class="sub">Compiled into the binary.</span>`}
    <span class="grow"></span><button class="btn outline" data-act="wrap" aria-pressed="${wrap}">Toggle Wrap</button></div>`;
  if(src.error) return h + `<div class="banner warn">${esc(src.error)}</div>`;
  for(const f of src.files){
    h += `<div class="fname">${esc(f.path)}</div>` + codeBox(f.content, /\.ya?ml$/.test(f.path) ? "yaml" : /\.sql$/.test(f.path) ? "sql" : "go");
  }
  return h;
}

async function eventsTab(d, sel){
  const p = new URLSearchParams({dag_id:d.dag_id, limit:"200"}); if(sel.run) p.set("run_id", sel.run); if(sel.task) p.set("task_id", sel.task);
  const {event_logs} = await api(`/eventLogs?${p}`);
  if(!event_logs.length) return `<div class="empty">No events recorded for this ${sel.kind==="dag"?"DAG":sel.kind==="run"?"run":"task"} yet.</div>`;
  return eventTable(event_logs, false);
}
function eventTable(evs, withDag){
  return `<table class="tbl"><thead><tr><th>When</th><th>Event</th><th>Owner</th>${withDag?"<th>DAG</th>":""}<th>Run</th><th>Task</th><th>Extra</th></tr></thead><tbody>${evs.map(e=>
    `<tr><td class="nowrap">${fmtZ(e.when)}</td><td><span class="badge grey">${esc(e.event)}</span></td><td>${esc(e.owner)}</td>${withDag?`<td>${e.dag_id?`<a href="#/dags/${enc(e.dag_id)}"><code>${esc(e.dag_id)}</code></a>`:""}</td>`:""}<td><code class="sm">${esc(e.run_id||"")}</code></td><td><code>${esc(e.task_id||"")}</code></td><td class="extra">${esc(e.extra||"")}</td></tr>`).join("")}</tbody></table>`;

// ---- tab: logs ---------------------------------------------------------------------
async function renderLogs(d, sel, run, ti, q, fresh){
  const body = document.getElementById("pbody");
  if(!ti){ body.innerHTML = `<div class="empty">This task instance does not exist in this run.</div>`; return; }
  const tries = ti.try_number||0, pick = Math.min(tries, +q.get("try")||tries);
  if(!tries){ body.innerHTML = ti.error ? `<pre class="err">${esc(ti.error)}</pre><p class="sub">The task failed before it started, so there is no log file.</p>`
    : `<div class="empty">No log yet: the task has not started${ti.state==="skipped"?" (it was skipped)":ti.state==="upstream_failed"?" (an upstream task failed)":""}.</div>`; return; }
  const url = `/dags/${enc(d.dag_id)}/dagRuns/${enc(sel.run)}/taskInstances/${enc(sel.task)}/logs/${pick}${sel.mi>=0?`?map_index=${sel.mi}`:""}`;
  let box = document.getElementById("logBox");
  if(fresh || !box || box.dataset.url !== url || document.querySelectorAll(".tries a").length !== tries){
    body.innerHTML = `<div class="logHead"><div class="tries">${Array.from({length:tries},(_,i)=>`<a href="${dagHref({try:i+1})}" class="${i+1===pick?"on":""}">Attempt ${i+1}</a>`).join("")}</div>
      <span class="grow"></span><a class="btn outline" href="/api/v1${url}" target="_blank" rel="noopener">See raw log</a></div><pre class="log" id="logBox" data-url="${esc(url)}">Loading…</pre>`;
    box = document.getElementById("logBox"); fresh = true;
  } else if(!LIVE.includes(ti.state) && box.dataset.done==="1") return;
  const stick = fresh || box.scrollTop + box.clientHeight >= box.scrollHeight - 20;
  try{ const txt = await api(url); if(box.textContent !== txt) box.textContent = txt; }catch(e){ box.textContent = e.message; }
  box.dataset.done = LIVE.includes(ti.state) ? "0" : "1";
  if(stick) box.scrollTop = box.scrollHeight;
}

// ---- tab: xcom ---------------------------------------------------------------------
function xcomTab(run, sel){
  const slot = sel.mi>=0 ? `${sel.task}#${sel.mi}` : sel.task;
  const x = run.xcom?.[slot] || {};
  const keys = Object.keys(x);
  if(!keys.length) return `<div class="empty">No XComs pushed by this task instance.</div>`;
  return `<table class="tbl"><thead><tr><th>Key</th><th>Value</th></tr></thead><tbody>${keys.sort().map(k=>
    `<tr><td><code>${esc(k)}</code></td><td><pre class="json inline">${esc(typeof x[k]==="string" ? x[k] : JSON.stringify(x[k],null,2))}</pre></td></tr>`).join("")}</tbody></table>`;
}

// ---- tab: task duration --------------------------------------------------------------
function durationTab(d, sel){
  const pts = d.runs.map(r=>({r, ti:r.task_instances?.[sel.task]})).filter(p=>p.ti?.start_date);
  if(!pts.length) return `<div class="empty">No finished instances of <code>${esc(sel.task)}</code> in the runs shown.</div>`;
  const vals = pts.map(p=>secs(p.ti.start_date, p.ti.end_date)), max = Math.max(1,...vals);
  const avg = vals.reduce((a,b)=>a+b,0)/vals.length;
  let h = `<p class="sub">Duration of <code>${esc(sel.task)}</code> across the ${pts.length} run${pts.length>1?"s":""} in the grid. Average ${hms(avg)}, longest ${hms(max)}.</p>
    <div class="dchart"><div class="dy"><span>${hms(max)}</span><span>${hms(max/2)}</span><span>00:00:00</span></div><div class="dplot">
    <i class="avg" style="bottom:${avg/max*100}%" title="average ${hms(avg)}"></i>`;
  pts.forEach((p,i)=>{ const v = vals[i];
    h += `<a class="dbar ${p.r.dag_run_id===sel.run?"on":""}" href="${dagHref({run:p.r.dag_run_id})}" style="height:${Math.max(1.5, v/max*100)}%;background:${color(p.ti.state)}" title="${esc(p.r.dag_run_id)}&#10;${fmtZ(p.r.logical_date)}&#10;${hms(v)} · ${esc(st(p.ti.state))}"></a>`; });
  return h + `</div></div><div class="dx"><span>${esc(shortDate(pts[0].r.logical_date))}</span><span>${esc(shortDate(pts[pts.length-1].r.logical_date))}</span></div>`;
}

function openActDlg({title, body, confirm, danger, onConfirm}){
  const dlg = document.getElementById("actDlg");
  dlg.innerHTML = `<form method="dialog"><h2>${title}</h2><div class="dlgBody">${body}</div><div class="formerr" id="actErr" role="alert"></div>
    <div class="row"><button class="btn" value="cancel" formnovalidate>Cancel</button><button class="btn ${danger?"dangerFill":"primary"}" value="go" id="actGo">${confirm}</button></div></form>`;
  dlg.querySelector("form").onsubmit = async e => {
    if(e.submitter?.value !== "go") return;
    e.preventDefault(); const b = document.getElementById("actGo"); b.disabled = true;
    try{ await onConfirm(dlg); dlg.close(); }catch(x){ document.getElementById("actErr").textContent = x.message; b.disabled = false; }
  };
  dlg.showModal();
}
function affectedPreview(d, sel, up, down){
  const ids = new Set([sel.task]); if(up) relatives(d, sel.task, "up").forEach(x=>ids.add(x)); if(down) relatives(d, sel.task, "down").forEach(x=>ids.add(x));
  return [...ids];
}
function clearAction(){
  const d = DV.data, sel = selection(route().q);
  const runDone = ["success","failed"].includes(DV.run?.state);
  const note = runDone ? "" : `<div class="banner warn">This run is ${esc(DV.run?.state)}. Tasks can be cleared once it has finished; use <b>Mark state as…</b> to stop a running task.</div>`;
  if(sel.kind==="run"){
    openActDlg({title:`Clear run`, confirm:"Clear", body:`${note}<p>Reset task instances of <code>${esc(sel.run)}</code> so the scheduler runs them again.</p>
      <label class="chk"><input type="checkbox" id="optFailed"> Only failed tasks</label>`,
      onConfirm: async dlg => { const r = await post(`/dags/${enc(d.dag_id)}/dagRuns/${enc(sel.run)}/clear`, {task_ids:[], only_failed:dlg.querySelector("#optFailed").checked});
        toast(r.cleared.length ? `Cleared ${r.cleared.length} task${r.cleared.length>1?"s":""}` : "Nothing to clear"); render(); }});
    return;
  }
  const upd = dlg => { const ids = affectedPreview(d, sel, dlg.querySelector("#optUp").checked, dlg.querySelector("#optDown").checked);
    dlg.querySelector("#affected").innerHTML = ids.map(x=>`<code>${esc(x)}</code>`).join(" "); };
  openActDlg({title:`Clear <code>${esc(sel.task)}</code>`, confirm:"Clear", body:`${note}<p>Clear the task instance in <code>${esc(sel.run)}</code> so it runs again${sel.mi>=0?" (all mapped instances are cleared)":""}.</p>
    <div class="chkrow"><label class="chk"><input type="checkbox" id="optDown" checked> Downstream</label><label class="chk"><input type="checkbox" id="optUp"> Upstream</label><label class="chk"><input type="checkbox" id="optFailed"> Only failed</label></div>
    <p class="sub">Affected tasks: <span id="affected"></span></p>`,
    onConfirm: async dlg => { const r = await post(`/dags/${enc(d.dag_id)}/dagRuns/${enc(sel.run)}/clear`, {task_ids:[sel.task],
        include_downstream:dlg.querySelector("#optDown").checked, include_upstream:dlg.querySelector("#optUp").checked, only_failed:dlg.querySelector("#optFailed").checked});
      toast(r.cleared.length ? `Cleared ${r.cleared.length} task${r.cleared.length>1?"s":""}` : "Nothing to clear"); render(); }});
  const dlg = document.getElementById("actDlg"); upd(dlg); dlg.querySelectorAll("#optUp,#optDown").forEach(c=>c.onchange=()=>upd(dlg));
}
function markAction(state){
  const d = DV.data, sel = selection(route().q), live = DV.run?.state==="running";
  const liveNote = live ? `<p class="sub">This run is running: running task instances are stopped and finish as <b>${state}</b>. The scheduler applies this within a few seconds.</p>` : "";
  if(sel.kind==="run"){
    openActDlg({title:`Mark run as <span class="spill" style="border-color:${color(state)}"><i style="background:${color(state)}"></i>${state}</span>`, confirm:`Mark ${state}`, danger: state==="failed",
      body:`<p>${state==="success" ? "Every task instance that has not succeeded is set to success." : "Running task instances are set to failed and tasks that have not started are skipped."}</p>${liveNote}`,
      onConfirm: async () => { const r = await post(`/dags/${enc(d.dag_id)}/dagRuns/${enc(sel.run)}/mark`, {new_state:state}); toast(r.queued ? "Sent to the scheduler" : `Run marked ${state}`); render(); }});
    return;
  }
  const upd = dlg => { const ids = affectedPreview(d, sel, dlg.querySelector("#optUp").checked, dlg.querySelector("#optDown").checked);
    dlg.querySelector("#affected").innerHTML = ids.map(x=>`<code>${esc(x)}${x===sel.task&&sel.mi>=0?`[${sel.mi}]`:""}</code>`).join(" "); };
  openActDlg({title:`Mark <code>${esc(sel.task)}${sel.mi>=0?`[${sel.mi}]`:""}</code> as <span class="spill" style="border-color:${color(state)}"><i style="background:${color(state)}"></i>${state}</span>`,
    confirm:`Mark ${state}`, danger: state==="failed",
    body:`<div class="chkrow"><label class="chk"><input type="checkbox" id="optUp"> Upstream</label><label class="chk"><input type="checkbox" id="optDown"> Downstream</label></div>
      <p class="sub">Affected tasks: <span id="affected"></span></p>
      <p class="sub">Downstream tasks that failed or are upstream_failed are cleared so they run again.</p>${liveNote}`,
    onConfirm: async dlg => { const body = {new_state:state, include_upstream:dlg.querySelector("#optUp").checked, include_downstream:dlg.querySelector("#optDown").checked};
      if(sel.mi>=0) body.map_index = sel.mi;
      const r = await post(`/dags/${enc(d.dag_id)}/dagRuns/${enc(sel.run)}/taskInstances/${enc(sel.task)}/mark`, body);
      toast(r.queued ? "Sent to the scheduler" : `Marked ${state}${r.changed?.length>1?` (${r.changed.length} tasks affected)`:""}`); render(); }});
  const dlg = document.getElementById("actDlg"); upd(dlg); dlg.querySelectorAll("#optUp,#optDown").forEach(c=>c.onchange=()=>upd(dlg));
}
async function reparseAction(){
  const d = DV.data, b = document.getElementById("reparseBtn"); b.disabled = true;

  if(el.id==="fClear") return goDag({base_date:null, run_type:null, run_state:null, filter_task:null, filter_mode:null});
  if(el.dataset.selrun!==undefined){ const same = sel.run===el.dataset.selrun && !sel.task; return goDag({run: same?null:el.dataset.selrun, task:null, mi:null}); }
  if(el.dataset.seltask!==undefined){ const same = sel.task===el.dataset.seltask && !sel.run; return goDag({task: same?null:el.dataset.seltask, run: el.closest("svg") ? sel.run||null : null, mi:null}); }
  if(el.dataset.selcell!==undefined){ const [run, task] = el.dataset.selcell.split("|"); const same = sel.run===run && sel.task===task; return goDag(same ? {run:null, task:null, mi:null} : {run, task, mi:null}); }

      document.querySelectorAll(".codebox").forEach(c=>c.classList.toggle("wrap", on)); el.setAttribute("aria-pressed", on); return; }

document.addEventListener("change", e=>{
  if(!document.getElementById("dagPage")) return;
  const map = {fBase:"base_date", fType:"run_type", fState:"run_state", fNum:"num_runs"};

});
document.addEventListener("keydown", e=>{
  if(!document.getElementById("dagPage") || document.querySelector("dialog[open]") || e.target.closest("input,select,textarea")) return;
  const d = DV.data, sel = selection(route().q); if(!d) return;
  if(e.key==="Escape" && sel.kind!=="dag"){ goDag({run:null, task:null, mi:null}); return; }
  if(e.key==="ArrowLeft" || e.key==="ArrowRight"){
    const ids = d.runs.map(r=>r.dag_run_id); if(!ids.length) return; e.preventDefault();
    const i = ids.indexOf(sel.run), n = i<0 ? ids.length-1 : Math.max(0, Math.min(ids.length-1, i + (e.key==="ArrowLeft"?-1:1)));
    goDag({run: ids[n], mi:null});
  }
  if(e.key==="ArrowUp" || e.key==="ArrowDown"){
    const ids = visibleTasks(d, route().q).map(t=>t.task_id); if(!ids.length) return; e.preventDefault();
    const i = ids.indexOf(sel.task), n = i<0 ? 0 : Math.max(0, Math.min(ids.length-1, i + (e.key==="ArrowUp"?-1:1)));
    goDag({task: ids[n], mi:null});
  }
});

const TI_TABS = [["grid","Grid"],["details","Task Instance Details"],["rendered","Rendered Template"],["logs","Log"],["xcom","XCom"]];
const TI_ICON = {grid: ICON.grid, details: PI.details, rendered: PI.code, logs: PI.logs, xcom: PI.xcom};
async function viewTI(id, q){
  const sel = selection(q);
  if(!sel.run || !sel.task){ location.hash = `#/dags/${enc(id)}`; return; }
  const d = current = DV.data = await api(`/dags/${enc(id)}?runs=1`);
  const t = d.tasks.find(x=>x.task_id===sel.task);
  if(!t) throw new Error(`task ${sel.task} not found in ${id}`);
  const run = DV.run = await api(`/dags/${enc(id)}/dagRuns/${enc(sel.run)}`);
  const ti = sel.mi>=0 ? (run.mapped_task_instances?.[sel.task]||[])[sel.mi] : run.task_instances[sel.task];
  const tab = ["details","rendered","logs","xcom"].includes(q.get("tab")) ? q.get("tab") : "details";
  const key = JSON.stringify([id, sel, tab]);
  let page = document.getElementById("tiPage");
  const fresh = !page || page.dataset.key !== key;
  if(fresh){
    $app.innerHTML = `<div id="tiPage" data-key="${esc(key)}">${dagTopHtml(d)}
      <h2 class="tiTitle"><span>Task Instance:</span> ${esc(sel.task)}${sel.mi>=0?` [${sel.mi}]`:""} <span>at</span> ${esc(fmt(run.logical_date))}</h2>
      <nav class="pilltabs">${TI_TABS.map(([k,l])=>`<a href="${k==="grid" ? `#/dags/${enc(id)}?run=${enc(sel.run)}&task=${enc(sel.task)}${sel.mi>=0?`&mi=${sel.mi}`:""}` : tiHref(id, sel.run, sel.task, sel.mi, k)}" class="${k===tab?"on":""}">${TI_ICON[k]}${l}</a>`).join("")}</nav>
      <div class="pbody tipbody" id="pbody"></div></div>`;
  }
  renderDagHeader(d);
  const body = document.getElementById("pbody");
  if(!ti){ body.innerHTML = `<div class="empty">This task instance does not exist in this run.</div>`; return; }
  const live = LIVE.includes(ti.state) || run.state==="running";
  if(!fresh && tab!=="logs" && !(tab==="details" && live)) return;
  switch(tab){
    case "details": body.innerHTML = tiFullDetails(d, run, ti, t, sel); break;
    case "rendered": body.innerHTML = await renderedTab(d, sel); break;
    case "logs": await renderLogs(d, sel, run, ti, q, fresh); break;
    case "xcom": body.innerHTML = xcomTab(run, sel); break;
  }
}
function blockingDeps(d, run, ti, t){
  const rows = [], s = st(ti.state);
  if(run.state !== "running") rows.push(["Dagrun Running", `Task instance's dagrun was not in the 'running' state but in the state '${run.state}'.`]);
  if(["success","failed","skipped","upstream_failed"].includes(s)) rows.push(["Task Instance State", `Task is in the '${s}' state.`]);
  else if(["running","queued","up_for_reschedule"].includes(s)) rows.push(["Task Instance State", `Task is in the '${s}' state.`]);
  else if(s==="up_for_retry") rows.push(["Not In Retry Period", `Task is not ready for retry yet: it waits ${t.retry_delay} between tries.`]);
  else {
    const ups = t.upstream.map(u=>[u, st(run.task_instances[u]?.state)]);
    const notDone = ups.filter(([,x])=>!["success","failed","skipped","upstream_failed"].includes(x));
    const notOk = ups.filter(([,x])=>x!=="success");
    if(t.trigger_rule==="all_success" && notOk.length)
      rows.push(["Trigger Rule", `Task's trigger rule 'all_success' requires all upstream tasks to have succeeded, but found ${notOk.length} non-success(es). upstream_states=${JSON.stringify(Object.fromEntries(ups))}, upstream_task_ids=${JSON.stringify(t.upstream)}`]);
    else if(notDone.length)
      rows.push(["Trigger Rule", `Task's trigger rule '${t.trigger_rule}' is waiting for ${notDone.length} upstream task(s) to finish: ${notDone.map(([u])=>u).join(", ")}`]);
  }
  return rows;
}
function attrTable(obj){
  return `<table class="tbl attrs"><thead><tr><th>Attribute</th><th>Value</th></tr></thead><tbody>${Object.keys(obj).sort().map(k=>
    `<tr><td>${esc(k)}</td><td><code>${esc(obj[k]==null||obj[k]===""?"None":typeof obj[k]==="object"?JSON.stringify(obj[k]):String(obj[k]))}</code></td></tr>`).join("")}</tbody></table>`;
}
function tiFullDetails(d, run, ti, t, sel){
  const deps = blockingDeps(d, run, ti, t);
  let h = `<h2 class="sech">Task Instance Details</h2><h3 class="subh">Dependencies Blocking Task From Getting Scheduled</h3>`;
  h += deps.length ? `<table class="tbl attrs"><thead><tr><th>Dependency</th><th>Reason</th></tr></thead><tbody>${deps.map(([a,b])=>`<tr><td>${esc(a)}</td><td><code>${esc(b)}</code></td></tr>`).join("")}</tbody></table>`
    : `<p class="sub">All dependencies are met but the task instance is not running. In most cases this just means that the task will probably be scheduled soon unless the pool has no free slots or the DAG has reached max_active_runs.</p>`;
  if(ti.error) h += `<pre class="err" style="margin-top:14px">${esc(ti.error)}</pre>`;
  const dur = ti.start_date ? secs(ti.start_date, ti.end_date) : null;
  h += `<h3 class="subh">Task Instance Attributes</h3>` + attrTable({
    dag_id: d.dag_id, dag_run: `<DagRun ${d.dag_id} @ ${run.logical_date}: ${run.run_id}, state:${run.state}, queued_at: ${run.queued_at}. run_type: ${run.run_type}>`,
    duration: dur==null ? null : dur.toFixed(6), end_date: ti.end_date ? fmt(ti.end_date) : null, execution_date: fmt(run.logical_date),
    logical_date: fmt(run.logical_date), data_interval_start: fmt(run.data_interval_start), data_interval_end: fmt(run.data_interval_end),
    log_url: location.origin + "/" + tiHref(d.dag_id, sel.run, sel.task, sel.mi, "logs"), map_index: sel.mi, max_tries: t.retries+1,
    note: ti.note||null, operator: t.operator, pool: ti.pool||t.pool, pool_slots: t.pool_slots, priority_weight: t.priority_weight,
    run_id: run.run_id, start_date: ti.start_date ? fmt(ti.start_date) : null, state: st(ti.state), task_id: sel.task, try_number: ti.try_number||0,
    error: ti.error||null,
  });
  h += `<h3 class="subh">Task Attributes</h3>` + attrTable({
    task_id: t.task_id, operator: t.operator, owner: d.owner, trigger_rule: t.trigger_rule, retries: t.retries, retry_delay: t.retry_delay,
    execution_timeout: t.timeout==="-" ? null : t.timeout, pool: t.pool, pool_slots: t.pool_slots, priority_weight: t.priority_weight, sla: t.sla||null,
    upstream_task_ids: t.upstream, downstream_task_ids: t.downstream, template_fields: t.template_fields, outlets: t.outlets||[],
    extra_links: (t.extra_links||[]).map(l=>l.name), is_mapped: t.is_mapped, is_sensor: t.is_sensor, is_branch: t.is_branch,
  });
  return h;
}

  const states = ["","success","failed","running","queued","up_for_retry","upstream_failed","skipped","none"], oneDag = !!q.get("dag_id");

    tis.length ? tis.map(x=>`<tr><td>${pill(x.state)}</td>${oneDag?"":`<td><a href="#/dags/${enc(x.dag_id)}"><code>${esc(x.dag_id)}</code></a></td>`}
      <td><a href="${tiHref(x.dag_id, x.run_id, x.task_id, x.map_index, "details")}"><code>${esc(x.task_id)}</code></a>${x.note?' <span class="badge grey" title="'+esc(x.note)+'">note</span>':""}</td>
      <td><a href="#/dags/${enc(x.dag_id)}?run=${enc(x.run_id)}&task=${enc(x.task_id)}${x.map_index>=0?`&mi=${x.map_index}`:""}"><code class="sm">${esc(x.run_id)}</code></a></td>
      <td>${x.map_index}</td><td class="nowrap">${fmt(x.logical_date)}</td><td class="nowrap">${fmt(x.start_date)}</td><td class="nowrap">${fmt(x.end_date)}</td>
      <td>${x.start_date?hms(secs(x.start_date,x.end_date)):"–"}</td><td>${x.try_number}</td><td>${esc(x.operator)}</td><td>${esc(x.pool)}</td></tr>`).join("")
