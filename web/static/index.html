// ---- notes editing & copy buttons ----------------------------------------------------
document.addEventListener("click", async e=>{
  const cp = e.target.closest("[data-copy]");
  if(cp){ try{ await navigator.clipboard.writeText(cp.dataset.copy); toast("Copied"); }catch{ toast("Copy failed"); } return; }
  const sec = e.target.closest("section.notes"); if(!sec) return;
  const target = JSON.parse(sec.dataset.noteTarget), dagId = DV.data?.dag_id;
  if(e.target.closest("[data-note-edit]")){
    const cur = sec.querySelector(".noteText")?.textContent || "";
    sec.querySelector(".noteBody").innerHTML = `<textarea class="noteEdit" rows="4" maxlength="10000" aria-label="Note">${esc(cur)}</textarea>`;
    sec.querySelector(".noteActs").innerHTML = `<button class="btn" data-note-cancel>Cancel</button><button class="btn primary" data-note-save>Save Note</button>`;
    sec.querySelector("textarea").focus(); return;
  }
  if(e.target.closest("[data-note-cancel]")){ DV.paneKey = ""; render(); return; }
  if(e.target.closest("[data-note-save]")){
    const note = sec.querySelector("textarea").value.trim();
    const url = target.task ? `/dags/${enc(dagId)}/dagRuns/${enc(target.run)}/taskInstances/${enc(target.task)}/note` : `/dags/${enc(dagId)}/dagRuns/${enc(target.run)}/note`;
    try{ const r = await post(url, {note, ...(target.task && target.mi>=0 ? {map_index: target.mi} : {})}, "PUT");
      toast(r.queued ? "Note sent to the scheduler (run is in progress)" : note ? "Note saved" : "Note cleared"); DV.paneKey = ""; document.getElementById("tiPage")?.removeAttribute("data-key"); render(); }
    catch(x){ toast(x.message); }
  }
});

// ---- Security: users (CRUD) & roles, Browse: event log -------------------------------
const ROLES = ["Viewer","User","Op","Admin"];
async function usersPage(){
  const {users} = await api("/users");
  const rows = users.map(u=>`<tr class="${u.active?"":"inactive"}">
      <td>${esc(u.first_name||"")}</td><td>${esc(u.last_name||"")}</td><td><b>${esc(u.username)}</b>${u.username===ME.username?' <span class="badge grey">you</span>':""}</td>
      <td>${esc(u.email||"")}</td><td>${u.active?'<span class="yes">✓</span>':'<span class="no">✕</span>'}</td><td><span class="badge">${esc(u.role)}</span></td>
      <td class="nowrap">${u.last_login?fmtZ(u.last_login):"–"}</td><td>${u.login_count||0}</td><td>${u.api_tokens}</td>
      <td class="nowrap" style="text-align:right"><button class="iconbtn" data-user="edit" data-k="${esc(u.username)}">Edit</button><button class="iconbtn" data-user="token" data-k="${esc(u.username)}">API token</button>${u.username!==ME.username?`<button class="iconbtn danger" data-user="delete" data-k="${esc(u.username)}">Delete</button>`:""}</td></tr>`).join("");
  return `<div class="secHead"><h1 class="pageTitle" style="margin:0">List Users</h1><span class="grow"></span><button class="btn primary" data-user="add">+ Add user</button></div>
    <div class="panel"><table class="list"><thead><tr><th>First Name</th><th>Last Name</th><th>User Name</th><th>Email</th><th>Is Active?</th><th>Role</th><th>Last Login</th><th>Login Count</th><th>API tokens</th><th></th></tr></thead>
    <tbody>${rows || `<tr><td colspan="10" class="muted">No users: authentication is off (localhost only).</td></tr>`}</tbody></table></div>
    <p class="sub">Deactivating a user or resetting their password signs them out and revokes their API tokens (password reset). The last active Admin cannot be demoted, deactivated or deleted.</p>`;
}
async function rolesPage(){
  const [{roles}, users] = await Promise.all([api("/roles"), can("Admin") ? api("/users").catch(()=>({users:[]})) : {users:[]}]);
  const count = r => users.users.filter(u=>u.role===r).length;
  return `<h1 class="pageTitle">List Roles</h1><div class="panel"><table class="list"><thead><tr><th style="width:120px">Role</th><th>Permissions</th>${can("Admin")?"<th>Users</th>":""}</tr></thead><tbody>${roles.map(r=>
    `<tr><td><span class="badge">${esc(r.role)}</span></td><td><ul class="perms">${r.permissions.map(p=>`<li>${esc(p)}</li>`).join("")}</ul></td>${can("Admin")?`<td>${count(r.role)}</td>`:""}</tr>`).join("")}</tbody></table></div>
    <p class="sub">Roles are cumulative: each role can do everything the roles above it can. Assign roles in <a href="#/admin?tab=users">List Users</a>.</p>`;
}
async function eventsPage(){
  const q = route().q, p = new URLSearchParams({limit:"300"}); if(q.get("dag_id")) p.set("dag_id", q.get("dag_id"));
  const {event_logs} = await api(`/eventLogs?${p}`);
  return `<h1 class="pageTitle">Event Log</h1>${q.get("dag_id")?`<p class="sub">Filtered to <code>${esc(q.get("dag_id"))}</code>. <a href="#/admin?tab=events">Show all</a></p>`:""}
    <div class="panel">${event_logs.length ? eventTable(event_logs, true) : `<div class="empty">No events yet.</div>`}</div>`;

function userForm(u){
  const f = (id, label, val, type="text", extra="") => `<label for="${id}">${label}</label><input id="${id}" type="${type}" value="${esc(val||"")}" ${extra}>`;
  return `<div class="formgrid">
    ${f("uFirst","First name",u?.first_name,"text",'autocomplete="off"')}${f("uLast","Last name",u?.last_name,"text",'autocomplete="off"')}
    ${f("uName","User name",u?.username,"text", u ? "readonly" : 'required autocomplete="off" autocapitalize="off" spellcheck="false"')}
    ${f("uEmail","Email",u?.email,"email",'autocomplete="off"')}
    <label for="uRole">Role</label><select id="uRole">${ROLES.map(r=>`<option ${ (u?.role||"Viewer")===r?"selected":""}>${r}</option>`).join("")}</select>
    ${u ? `<label class="chk span2"><input type="checkbox" id="uActive" ${u.active?"checked":""}> Is active</label>` : ""}
    ${f("uPass", u ? "New password (optional)" : "Password", "", "password", 'autocomplete="new-password" minlength="8"')}
    ${f("uPass2", "Confirm password", "", "password", 'autocomplete="new-password"')}
  </div>`;
}
async function userAction(b){
  const name = b.dataset.k;
  const val = id => document.getElementById(id)?.value ?? "";
  if(b.dataset.user==="add" || b.dataset.user==="edit"){
    const u = name ? await api(`/users/${enc(name)}`) : null;
    openActDlg({title: u ? `Edit user <code>${esc(u.username)}</code>` : "Add user", confirm:"Save", body:userForm(u), onConfirm: async dlg => {
      const pw = val("uPass");
      if(!u && !val("uName").trim()) throw new Error("User name is required.");
      if((!u || pw) && pw.length < 8) throw new Error("Password must be at least 8 characters.");
      if(pw !== val("uPass2")) throw new Error("Passwords do not match.");
      const body = {first_name:val("uFirst"), last_name:val("uLast"), email:val("uEmail"), role:val("uRole")};
      if(pw) body.password = pw;
      if(u){ body.active = dlg.querySelector("#uActive").checked; await post(`/users/${enc(u.username)}`, body, "PATCH"); toast(`Saved ${u.username}`); }
      else { body.username = val("uName").trim(); await post("/users", body); toast(`Created ${body.username}`); }
      render();
    }});
    return;
  }
  if(b.dataset.user==="delete"){
    openActDlg({title:`Delete user <code>${esc(name)}</code>?`, confirm:"Delete", danger:true, body:`<p>The user can no longer sign in and their API tokens stop working. This cannot be undone.</p>`,
      onConfirm: async () => { await api(`/users/${enc(name)}`, {method:"DELETE"}); toast(`Deleted ${name}`); render(); }});
    return;
  }
  if(b.dataset.user==="token"){
    openActDlg({title:`New API token for <code>${esc(name)}</code>`, confirm:"Create token", body:`<p>Tokens act as the user (same role). Send as <code>Authorization: Bearer &lt;token&gt;</code>. It is shown only once.</p><div id="tokOut"></div>`,
      onConfirm: async dlg => { const r = await post(`/users/${enc(name)}/tokens`, {});
        dlg.querySelector("#tokOut").innerHTML = `<pre class="json">${esc(r.token)}</pre>`; dlg.querySelector("#actGo").hidden = true;
        dlg.querySelector("[value=cancel]").textContent = "Done"; render(); throw new Error(""); }});
  }
}
document.addEventListener("click", e=>{ const b = e.target.closest("[data-user]"); if(b) userAction(b); });

// ---- events & routing ------------------------------------------------------
document.addEventListener("click", async e=>{
  const ddBtn = e.target.closest(".dd>button");
  document.querySelectorAll(".dd.open").forEach(d=>{ if(!ddBtn || d!==ddBtn.parentElement) d.classList.remove("open"); });
  if(ddBtn){ ddBtn.parentElement.classList.toggle("open"); return; }
  if(e.target.closest(".ddm a")) document.querySelectorAll(".dd.open").forEach(d=>d.classList.remove("open"));
  const sortB = e.target.closest("[data-sort]");
  if(sortB){ const k=sortB.dataset.sort, same=qget("sort","dag_id")===k; location.hash = listHref({sort:k, dir: same && qget("dir","asc")==="asc" ? "desc" : "asc"}); return; }
  const pg = e.target.closest("[data-page]");
  if(pg && !pg.disabled){ location.hash = listHref({page: pg.dataset.page}); scrollTo(0,0); return; }
  if(e.target.closest("#autoRef")){ const on=!autoRefresh(); localStorage.setItem("dagsflow.autorefresh", on?"on":"off"); e.target.closest("#autoRef").setAttribute("aria-checked", on); toast(on?"Auto-refresh on":"Auto-refresh off"); return; }
  if(e.target.closest("#refreshBtn")){ render(); health(); return; }
  if(e.target.closest("#logoutBtn")){ try{ await api("/logout",{method:"POST"}); }catch{} location.href="/login"; return; }
  const rp = e.target.closest("[data-reparse]");
  if(rp){ rp.disabled = true;
    try{ const r = await post(`/dags/${enc(rp.dataset.reparse)}/reparse`, {}); toast(`Reparsed ${rp.dataset.reparse} at ${(fmt(r.parsed_at).split(", ")[1]||"")}`); render(); }
    catch(x){ toast(x.message); rp.disabled = false; } return; }
  const del = e.target.closest("[data-deldag]");
  if(del){ const id=del.dataset.deldag;
    if(!confirm(`Delete all runs, task instances and logs of ${id}? The DAG definition stays and will show up again with no history.`)) return;
    try{ await api(`/dags/${enc(id)}`, {method:"DELETE"}); toast(`Deleted metadata of ${id}`); render(); }catch(x){ toast(x.message); } return; }
  const t = e.target.closest("[data-pause],[data-trigger],[data-admin]"); if(!t) return;
  if(t.dataset.admin){ adminAction(t); return; }
  if(t.dataset.pause){ const paused = t.dataset.paused!=="true";
    try{ await post(`/dags/${enc(t.dataset.pause)}`, {is_paused:paused}, "PATCH"); toast(paused?`Paused ${t.dataset.pause}`:`Unpaused ${t.dataset.pause}`); render(); }catch(x){ toast(x.message); } }
  else if(t.dataset.trigger) openTrigger(t.dataset.trigger);
});
document.addEventListener("keydown", e=>{
  if((e.key==="Enter"||e.key===" ") && e.target.matches("g.node")){ e.preventDefault(); e.target.dispatchEvent(new MouseEvent("click",{bubbles:true})); }
});

async function render(){
  const {parts, q} = route();
  try{
    const tab = q.get("tab")||"pools";
    const navKey = parts[0]!=="admin" ? "dags" : tab==="datasets" ? "datasets" : ["users","roles"].includes(tab) ? "security" : ["errors","events","tis"].includes(tab) ? "browse" : "admin";
    document.querySelectorAll("[data-nav]").forEach(n=>n.classList.toggle("on", n.dataset.nav===navKey));
    if(parts[0]==="dags" && parts[1] && parts[2]==="ti") await viewTI(parts[1], q);
    else if(parts[0]==="dags" && parts[1]) await viewDag(parts[1], q);
    else if(parts[0]==="admin"){ current=null; await viewAdmin(q.get("tab")||"pools"); }
    else { current=null; await viewList(); }
  }catch(e){ $app.innerHTML = `<div class="banner err"><b>Could not load this page.</b> ${esc(e.message)}. <a href="#/">Back to DAGs</a></div>`; }
}
function refreshLoop(){ // live refresh, paused while the user is in a dialog or has text selected
  clearInterval(refreshTimer);
  refreshTimer = setInterval(()=>{ if(!autoRefresh() || document.querySelector(".noteEdit") || document.querySelector(".dd.open") || document.hidden || document.querySelector("dialog[open]") || String(getSelection()) || document.activeElement?.closest?.(".adminForm")) return;
    const y = scrollY; render().then(()=>scrollTo(0,y)); health(); }, 4000);
}
let lastPath = location.hash.split("?")[0];
window.addEventListener("hashchange", ()=>{ const p = location.hash.split("?")[0]; if(p!==lastPath) scrollTo(0,0); lastPath = p; render(); });
async function whoami(){ Object.assign(ME, await api("/me"));
  ["User","Op","Admin"].forEach(r=>document.body.classList.toggle("can-"+r, can(r)));
  if(ME.auth_enabled){
    document.getElementById("userMenu").hidden = false;
    document.getElementById("avatar").textContent = ME.username.slice(0,2).toUpperCase();
    document.getElementById("who").textContent = `Signed in as ${ME.username} (${ME.role})`;
  } }
function tick(){
  const d = new Date(), off = -d.getTimezoneOffset(), p = n=>String(Math.abs(n)).padStart(2,"0");
  const tz = TZ();
  document.getElementById("clock").textContent = `${p(d.getHours())}:${p(d.getMinutes())} ${tz} (${off<0?"-":"+"}${p(Math.trunc(off/60))}:${p(off%60)})`;
}
tick(); setInterval(tick, 15000);
whoami().then(()=>{ health(); render(); refreshLoop(); }).catch(()=>{});
